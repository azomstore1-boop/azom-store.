<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আমার অর্ডার | Azom Store</title><style>body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f4f6fa;color:#17243b;margin:0}.wrap{max-width:760px;margin:30px auto;padding:16px}.card{background:white;border:1px solid #dce2ea;border-radius:14px;padding:20px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #ccd5e2;width:100%;box-sizing:border-box;margin:6px 0}button{background:#138b50;color:white;border:0;cursor:pointer}.muted{color:#66758c}.status{display:inline-block;background:#fff0c2;padding:5px 10px;border-radius:20px;font-weight:bold}li{margin:8px 0}</style></head><body><main class="wrap"><h1>📦 আমার অর্ডার</h1><p class="muted">অর্ডার আইডি ও অর্ডার করার সময় দেওয়া মোবাইল নম্বর লিখুন।</p><section class="card"><form id="lookup"><label>অর্ডার আইডি<input id="orderId" required placeholder="অর্ডার আইডি"></label><label>মোবাইল নম্বর<input id="phone" required placeholder="01XXXXXXXXX" inputmode="tel"></label><button>অর্ডার দেখুন</button></form><p id="message"></p></section><section id="result" class="card" hidden></section><p><a href="./">← দোকানে ফিরে যান</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://YOUR_PROJECT.supabase.co';const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');const params=new URLSearchParams(location.search);if(params.get('id'))$('orderId').value=params.get('id');if(params.get('phone'))$('phone').value=params.get('phone');$('lookup').addEventListener('submit',async e=>{e.preventDefault();$('message').textContent='খোঁজা হচ্ছে…';$('result').hidden=true;try{const {data,error}=await db.rpc('lookup_order',{p_order_id:$('orderId').value.trim(),p_phone:$('phone').value.trim()});if(error)throw error;if(!data||data.error)throw Error('এই তথ্য দিয়ে অর্ডার পাওয়া যায়নি।');const o=data;$('result').innerHTML='<h2>অর্ডার '+escapeHtml(o.id)+'</h2><p>স্ট্যাটাস: <span class="status">'+escapeHtml(o.status)+'</span></p><p>তারিখ: '+escapeHtml(new Date(o.created_at).toLocaleString('bn-BD'))+'</p><h3>পণ্যসমূহ</h3><ul>'+(o.items||[]).map(x=>'<li>'+escapeHtml(x.name)+' — '+escapeHtml(x.quantity)+' × '+money(x.unit_price)+' = <b>'+money(x.line_total)+'</b></li>').join('')+'</ul><hr><p>পণ্যের মূল্য: '+money(o.subtotal)+'</p><p>ডেলিভারি চার্জ: '+money(o.delivery_charge)+'</p><h3>সর্বমোট: '+money(o.total)+'</h3><p>পেমেন্ট যাচাইয়ের পর স্ট্যাটাস আপডেট হবে।</p>';$('result').hidden=false;$('message').textContent='';}catch(err){$('message').textContent=err.message||'অর্ডার খুঁজে পাওয়া যায়নি।';}});function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}</script></body></html>
