<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আমার অর্ডার | AZOM STORE</title><style>body{margin:0;font-family:system-ui,'Noto Sans Bengali',sans-serif;background:linear-gradient(135deg,#fff3d4,#f2f4ff);color:#172033}header{background:#111b36;color:white;padding:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a,button{padding:10px 13px;border:0;border-radius:10px;text-decoration:none;font-weight:750;cursor:pointer;background:#ffb000;color:#201800}.wrap{max-width:950px;margin:auto;padding:18px}.hero{padding:22px;border-radius:20px;color:white;background:linear-gradient(110deg,#17264b,#6758e8,#ff9d36)}.order{background:white;padding:16px;margin:14px 0;border-radius:16px;border:1px solid #e4e8f2}.muted{color:#718096;font-size:13px}.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ddd}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.total{font-size:20px;color:#5143cc;font-weight:900}input{padding:12px;border:1px solid #ddd;border-radius:10px;width:min(100%,420px)}</style></head><body><header><b>✦ AZOM STORE · আমার অর্ডার</b><nav><a href="index.html">শপিং</a> <a href="whatsapp.html">WhatsApp সেন্টার</a></nav></header><main class="wrap"><section class="hero"><h2>📦 অর্ডার করা প্রোডাক্ট</h2><p>একই ব্রাউজারে সংরক্ষিত অর্ডার, পণ্যের নাম, পরিমাণ, দাম ও মোট দেখুন।</p></section><p><input id="q" placeholder="অর্ডার আইডি / নাম / ফোন দিয়ে খুঁজুন"></p><div id="list"></div></main><script>const KEY='azom_store_customer_orders_v1',WA='8801300435611';const $=id=>document.getElementById(id),money=n=>'৳'+Number(n||0).toLocaleString('en-BD');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function read(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}function msg(o){return ['আসসালামু আলাইকুম, Azom Store!','অর্ডার আইডি: '+(o.orderId||''),'তারিখ: '+(o.date||''),'নাম: '+(o.customerName||''),'মোবাইল: '+(o.customerPhone||''),'ঠিকানা: '+(o.address||''),'','অর্ডারের পণ্য:',...(o.items||[]).map((x,i)=>`${i+1}. ${x.name||'পণ্য'} (${x.id||''}) — ${x.qty||0} পিস × ${money(x.price)} = ${money((Number(x.qty)||0)*(Number(x.price)||0))}`),'','পণ্যের মোট: '+money(o.subtotal),'ডেলিভারি: '+money(o.delivery),'সর্বমোট: '+money(o.total),'পেমেন্ট: '+(o.paymentMethod||''),'প্রেরকের নম্বর: '+(o.paymentSender||''),'TrxID: '+(o.paymentTrx||''),'দয়া করে অর্ডারটি যাচাই করে নিশ্চিত করবেন।'].join('\n')}function send(id){const o=read().find(x=>x.orderId===id);if(o)location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg(o));else alert('অর্ডার পাওয়া যায়নি')}function render(){let q=$('q').value.toLowerCase(),a=read().filter(o=>!q||[o.orderId,o.customerName,o.customerPhone].join(' ').toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(o=>`<article class="order"><div class="row"><b>অর্ডার: ${esc(o.orderId)}</b><span class="muted">${esc(o.date||'')}</span></div><p><b>নাম:</b> ${esc(o.customerName)} · <b>ফোন:</b> ${esc(o.customerPhone)}</p><p><b>ঠিকানা:</b> ${esc(o.address||'')}</p><h3>🛍️ প্রোডাক্ট লিস্ট</h3>${(o.items||[]).map((x,i)=>`<div class="item"><span>${i+1}. ${esc(x.name)}<br><small>${money(x.price)} × ${Number(x.qty)||0} পিস</small></span><b>${money((Number(x.price)||0)*(Number(x.qty)||0))}</b></div>`).join('')}<div class="row"><span>পণ্যের মোট: ${money(o.subtotal)}<br>ডেলিভারি: ${money(o.delivery)}</span><span class="total">${money(o.total)}</span></div><p class="muted">পেমেন্ট: ${esc(o.paymentMethod)} · প্রেরক: ${esc(o.paymentSender)} · TrxID: ${esc(o.paymentTrx)}</p><button onclick="send('${esc(o.orderId)}')">এই অর্ডার WhatsApp-এ পাঠান</button></article>`).join(''):'<p>অর্ডার নেই। একই ব্রাউজারে শপিং পেজ থেকে অর্ডার করুন।</p>'} $('q').addEventListener('input',render);window.addEventListener('storage',render);render();</script></body></html>
