<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | Azom Store</title><style>body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f4f6fa;color:#17243b;margin:0}.wrap{max-width:1100px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #dce2ea;border-radius:14px;padding:18px;margin:12px 0}input,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #ccd5e2;margin:5px}button{cursor:pointer;background:#17243b;color:white}.green{background:#138b50}.danger{background:#a32828}.order{border:1px solid #e0e5ed;padding:14px;border-radius:10px;margin:12px 0}.muted{color:#66758c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="wrap"><h1>Azom Store — Admin Panel</h1><section id="login" class="card"><h2>অ্যাডমিন লগইন</h2><form id="loginForm"><input id="email" type="email" required placeholder="Admin email"><input id="password" type="password" required placeholder="Password"><button>লগইন</button></form><p id="loginMsg" class="muted"></p></section><section id="dashboard" class="hidden"><div class="row"><h2 style="flex:1">অর্ডারসমূহ</h2><button id="refresh">রিফ্রেশ</button><button id="logout">লগআউট</button></div><p id="msg" class="muted"></p><div id="orders"></div></section><p><a href="./">← দোকানে ফিরে যান</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://YOUR_PROJECT.supabase.co';const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');async function loadOrders(){ $('msg').textContent='লোড হচ্ছে…';const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(300);if(error){$('msg').textContent='অর্ডার লোড হয়নি: '+error.message;return;}$('msg').textContent=data.length+'টি অর্ডার';$('orders').innerHTML=data.map(o=>'<article class="order"><div class="row"><h3 style="flex:1">'+esc(o.customer_name)+' · '+esc(o.id)+'</h3><b>'+esc(o.status)+'</b></div><p>'+esc(o.customer_phone)+' | '+esc(o.customer_village)+', '+esc(o.customer_thana)+', '+esc(o.customer_district)+'</p><ul>'+(o.items||[]).map(x=>'<li>'+esc(x.name)+' — '+esc(x.quantity)+' × '+money(x.unit_price)+'</li>').join('')+'</ul><p>পণ্যের মূল্য: '+money(o.subtotal)+' | ডেলিভারি: '+money(o.delivery_charge)+' | <b>মোট: '+money(o.total)+'</b></p><p>পেমেন্ট: '+esc(o.payment_method)+' | প্রেরক: '+esc(o.payment_sender)+' | TrxID: <b>'+esc(o.payment_trx)+'</b></p><p class="muted">'+esc(new Date(o.created_at).toLocaleString('bn-BD'))+'</p><div class="row"><button class="green" data-order-id="'+o.id+'" data-status="Confirmed">Confirmed করুন</button><button class="danger" data-order-id="'+o.id+'" data-status="Pending">Pending করুন</button></div></article>').join('')||'<p>কোনো অর্ডার নেই।</p>';$('orders').querySelectorAll('[data-order-id]').forEach(b=>b.addEventListener('click',()=>setStatus(b.dataset.orderId,b.dataset.status)));}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='লগইন হচ্ছে…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent=error.message;return;}if(data.user.app_metadata?.role!=='admin'){await db.auth.signOut();$('loginMsg').textContent='এই অ্যাকাউন্টে admin role নেই। Supabase-এ app_metadata role=admin সেট করুন।';return;}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadOrders();});window.setStatus=async(id,status)=>{if(!confirm('অর্ডার '+status+' করবেন?'))return;const {error}=await db.from('orders').update({status}).eq('id',id);if(error)alert('আপডেট হয়নি: '+error.message);else loadOrders();};$('refresh').onclick=loadOrders;$('logout').onclick=async()=>{await db.auth.signOut();$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');};db.auth.getSession().then(async({data})=>{if(data.session){const {data:u}=await db.auth.getUser();if(u.user?.app_metadata?.role==='admin'){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadOrders();}}});</script></body></html>
